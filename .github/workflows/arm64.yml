# =============================================================================
# 在 Windows on ARM 上原生构建 PDFsam Basic —— 路径 A（从源码编译 OpenJFX）
#
# ★ 关键结论（已验证）：Maven Central 上官方 OpenJFX 只有 win/linux/mac 以及
#   linux-aarch64 / mac-aarch64 分类器，**没有 windows-arm64**。Liberica 的 jdk+fx
#   把 JavaFX 以 JMOD 形式内嵌进 JDK，也拿不到可直接当 Maven 依赖装的 javafx jar。
#   因此"路径 B"在机械上行不通。唯一被验证的路线是 JabRef 在 WoA 上的做法：
#   在 ARM64 机器上从源码编译 OpenJFX，再 publish 到本地 Maven 仓库，让 pdfsam
#   从 ~/.m2 解析 windows-arm64 的 JavaFX 工件。
#
# Runner：windows-11-vs2026-arm（预装 Visual Studio，提供编译 JavaFX 原生组件
#   所需的 "Desktop development with C++" 工具链）。普通 windows-11-arm 没有 VS。
#
# OpenJFX 编译命令来自 blog.jabref.org/2026/06/15/running-jabref-on-windows-arm64
#   .\gradlew -PMAVEN_PUBLISH=true sdk publishJavafxPublicationToMavenLocal
# 在 aarch64 主机上会自动以 windows-aarch64 为目标编译。
#
# 已知限制（同 JabRef 文章）：JavaFX 的 WebKit 在 Windows ARM 上尚未构建，
#   因此 javafx-web 不可用。pdfsam 只依赖 javafx-controls + javafx-media、不用
#   WebView，故不受影响；media 在 windows-arm64 上由源码编译可得。
# =============================================================================
name: build-windows-arm64

# 纯手动触发：Actions 页面点 "Run workflow"，在 sha 框粘贴 pdfsam commit 的完整 SHA。
on:
  workflow_dispatch:
    inputs:
      sha:
        description: '粘贴要构建的 pdfsam commit 完整 SHA（40 位十六进制）。此框为自由文本框，不是分支/标签下拉。'
        required: true
        type: string
      # OpenJFX 源码 tag/分支，必须与 pdfsam 声明的 javafx 版本一致（当前 6.0.5 用 25.0.4）。
      # openjdk/jfx 的 tag 命名可能是 "25.0.4" 或 "jfx-25.0.4"，跑前先确认：
      #   git ls-remote --tags https://github.com/openjdk/jfx 25.0.4
      openjfx_ref:
        description: 'OpenJFX 源码 tag/分支（需与 pdfsam 的 javafx 版本 25.0.4 匹配）'
        required: false
        default: '25.0.4'
        type: string

permissions:
  contents: read

jobs:
  build-windows-arm64:
    name: build on windows-11-vs2026-arm
    # 路径 A 需要从源码编译 OpenJFX 原生组件，必须有 Visual Studio C++ 工具链。
    runs-on: windows-11-vs2026-arm

    steps:
      - name: Checkout pdfsam (user-specified SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Show target SHA (debug)
        shell: pwsh
        run: 'echo "Building pdfsam SHA: ${{ inputs.sha }} ; OpenJFX ref: ${{ inputs.openjfx_ref }}"'

      # 路径 A 中我们自己编译 JavaFX，所以 boot JDK 用普通 jdk 即可（不需要 jdk+fx）。
      - name: Set up JDK 25 (boot JDK for OpenJFX build + pdfsam compile)
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '25'
          java-package: 'jdk'

      - name: Install scoop
        uses: MinoruSekine/setup-scoop@v5

      # gettext: 仅构建期把 .po 编译成 .properties，运行期用 Java ResourceBundle，不依赖它（x64 模拟足够）。
      # maven: 构建 pdfsam。cmake/ninja/ant: OpenJFX 原生组件编译所需。
      - name: Install build tools (gettext, maven, cmake, ninja, ant)
        run: scoop install gettext maven cmake ninja ant

      - name: Show toolchain (debug)
        shell: pwsh
        run: |
          java -version
          mvn -v
          cmake --version
          ninja --version
          ant -version

      # ---- 路径 A 核心：在 ARM64 上从源码编译 OpenJFX 并发布到本地 Maven 仓库 ----
      - name: Clone & build OpenJFX for Windows ARM64 -> local Maven repo
        shell: pwsh
        env:
          OPENJFX_REF: ${{ inputs.openjfx_ref }}
        run: |
          git clone --depth 1 --branch "$env:OPENJFX_REF" https://github.com/openjdk/jfx.git jfx
          cd jfx
          .\gradlew.bat -PMAVEN_PUBLISH=true sdk publishJavafxPublicationToMavenLocal

      - name: Verify OpenJFX arm64 artifacts in local repo (debug)
        shell: pwsh
        run: |
          $p = "$env:USERPROFILE\.m2\repository\org\openjfx"
          if (Test-Path $p) {
            Get-ChildItem $p -Recurse -Filter "*windows-arm64*.jar" | Select-Object FullName
          } else {
            Write-Error "Local OpenJFX repo not found at $p -- OpenJFX build likely failed"
          }

      # pdfsam 把 JavaFX 当作 Maven 依赖（classifier = ${javafx.platform}）。
      # -Djavafx.platform=windows-arm64 覆盖该属性，让它从本地仓库解析刚编译好的 arm64 工件。
      # -DskipTests: headless ARM runner 无显示器，跑不了 TestFX UI 测试。
      # --% 阻止 PowerShell 把带点的 -D 参数拆坏。
      - name: Build pdfsam with Maven (use locally-built arm64 JavaFX)
        run: mvn --% -B -DskipTests -Djavafx.platform=windows-arm64 verify

      # ---- 可选：产出真正的 ARM64 安装包（jlink + jpackage） -----------------
      # pdfsam 的 -Drelease profile 会用 jlink 打出自包含运行时并 jpackage 成安装包。
      # 注意：jpackage 在 Windows 上通常依赖 WiX；若 runner 缺失，先 scoop install wixtoolset。
      # 若 jlink 报找不到 JavaFX 的 jmod，可能还需在 OpenJFX 编译步骤加 `jmods` 任务产出 jmod 文件。
      # - name: Package release (optional, produces installer)
      #   run: mvn --% -B -DskipTests -Djavafx.platform=windows-arm64 -Drelease verify
      # ----------------------------------------------------------------------

      - name: List build output (debug, helps locate the installer)
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Include *.exe,*.msi,*.zip -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\.m2\\|\\jfx\\' } |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload Windows ARM64 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfsam-windows-arm64
          path: |
            **/target/*.exe
            **/target/*.msi
            **/target/*.zip
            **/target/assembled/**
          if-no-files-found: warn
